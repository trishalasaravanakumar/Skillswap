<div class="max-w-6xl mx-auto px-margin-mobile lg:px-margin py-space-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Messages</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">Plan your skill swap with your match. New messages appear automatically.</p>
<div class="grid grid-cols-1 md:grid-cols-3 gap-space-md mt-space-md">
<aside id="convo-list" class="md:col-span-1 bg-surface-container-lowest rounded-xl shadow-sm p-space-sm space-y-space-xs h-[560px] overflow-y-auto"><p class="p-space-sm font-body-md text-body-md text-on-surface-variant">Loading...</p></aside>
<section class="md:col-span-2 bg-surface-container-lowest rounded-xl shadow-sm flex flex-col h-[560px]">
<div id="thread-head" class="p-space-md border-b border-outline-variant font-title-md text-title-md text-on-surface">Select a conversation</div>
<div id="thread" class="flex-1 overflow-y-auto p-space-md space-y-space-sm"></div>
<form id="send-form" class="hidden p-space-sm border-t border-outline-variant flex gap-space-sm">
<input id="msg-input" maxlength="1000" autocomplete="off" placeholder="Type a message..." class="w-full px-space-md py-space-sm bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"/>
<button type="submit" class="px-space-lg py-space-sm rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container shadow-sm">Send</button>
</form>
</section>
</div>
<p id="chat-msg" class="font-body-sm text-body-sm text-error mt-space-sm"></p>
</div>
</main><footer class="w-full bg-surface-container-low"><div class="w-full max-w-7xl mx-auto px-margin-mobile lg:px-margin py-space-xl flex flex-col md:flex-row items-center justify-between gap-space-md"><div class="flex items-center gap-space-sm"><img alt="Skill Swap Brand Logo" class="h-6 w-auto object-contain opacity-80" src="logo.svg"/><span class="font-title-md text-title-md text-on-surface">Skill Swap</span><span class="font-body-sm text-body-sm text-on-surface-variant ml-space-sm">Peer-to-peer learning network</span></div><div class="font-body-sm text-body-sm text-on-surface-variant text-center md:text-right">© 2026 Skill Swap. Bilateral learning and reciprocity for everyone.</div></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  var S = window.SkillSwap, esc = S.esc;
  var user = await S.requireLogin();
  if (!user) return;
  var sb = S.sb;
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var param = new URLSearchParams(location.search).get("with");
  var partner = param && UUID.test(param) && param !== user.id ? param : null;
  var msgs = [], names = {}, lastSig = "";

  function setMsg(t) { document.getElementById("chat-msg").textContent = t || ""; }

  async function loadAll() {
    var r = await sb.from("messages").select("*").order("created_at", { ascending: true });
    if (r.error) { setMsg("Could not load messages: " + r.error.message); return; }
    msgs = r.data || [];
    var ids = {};
    msgs.forEach(function (m) { ids[m.sender_id === user.id ? m.receiver_id : m.sender_id] = 1; });
    if (partner) ids[partner] = 1;
    var need = Object.keys(ids).filter(function (id) { return !names[id]; });
    if (need.length) {
      var p = await sb.from("profiles").select("*").in("id", need);
      (p.data || []).forEach(function (x) { names[x.id] = x; });
    }
    var sig = msgs.length + ":" + (msgs.length ? msgs[msgs.length - 1].id : "") + ":" + partner;
    if (sig !== lastSig) { lastSig = sig; render(true); }
  }

  function nameOf(id) { return (names[id] && names[id].display_name) || "Skill Swap member"; }

  function renderList() {
    var convos = {};
    msgs.forEach(function (m) {
      var other = m.sender_id === user.id ? m.receiver_id : m.sender_id;
      convos[other] = m;
    });
    if (partner && !convos[partner]) convos[partner] = null;
    var ids = Object.keys(convos).sort(function (a, b) {
      var ta = convos[a] ? convos[a].created_at : "9999", tb = convos[b] ? convos[b].created_at : "9999";
      return ta < tb ? 1 : -1;
    });
    var el = document.getElementById("convo-list");
    if (!ids.length) {
      el.innerHTML = '<p class="p-space-sm font-body-md text-body-md text-on-surface-variant">No conversations yet. Go to <a class="text-primary underline" href="matches.html">Find Matches</a> and click Request Swap.</p>';
      return;
    }
    el.innerHTML = ids.map(function (id) {
      var last = convos[id];
      var active = id === partner ? "bg-surface-container" : "hover:bg-surface-container-low";
      return '<button type="button" data-partner="' + esc(id) + '" class="w-full text-left p-space-sm rounded-lg ' + active + '">' +
        '<div class="font-title-md text-title-md text-on-surface">' + esc(nameOf(id)) + '</div>' +
        '<div class="font-body-sm text-body-sm text-on-surface-variant truncate">' + (last ? esc(last.body) : "Start the conversation") + '</div></button>';
    }).join("");
  }

  function renderThread(scroll) {
    var head = document.getElementById("thread-head"), th = document.getElementById("thread"), form = document.getElementById("send-form");
    if (!partner) { head.textContent = "Select a conversation"; th.innerHTML = ""; form.classList.add("hidden"); return; }
    var p = names[partner] || {};
    head.innerHTML = esc(nameOf(partner)) + (p.location ? ' <span class="font-body-sm text-body-sm text-on-surface-variant"> \u00b7 ' + esc(p.location) + '</span>' : "");
    form.classList.remove("hidden");
    var mine = msgs.filter(function (m) { return m.sender_id === partner || m.receiver_id === partner; });
    if (!mine.length) { th.innerHTML = '<p class="font-body-md text-body-md text-on-surface-variant">Say hello and suggest a time for your swap!</p>'; return; }
    th.innerHTML = mine.map(function (m) {
      var me = m.sender_id === user.id;
      var t = new Date(m.created_at).toLocaleString([], { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" });
      return '<div class="flex ' + (me ? "justify-end" : "justify-start") + '"><div class="max-w-[80%] px-space-md py-space-sm rounded-xl ' +
        (me ? "bg-primary text-on-primary" : "bg-surface-container text-on-surface") + '">' +
        '<div class="font-body-md text-body-md break-words">' + esc(m.body) + '</div>' +
        '<div class="font-label-sm text-label-sm opacity-70 mt-space-xs">' + esc(t) + '</div></div></div>';
    }).join("");
    if (scroll) th.scrollTop = th.scrollHeight;
  }

  function render(scroll) { renderList(); renderThread(scroll); }

  document.getElementById("convo-list").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-partner]") : null;
    if (!b) return;
    partner = b.getAttribute("data-partner");
    lastSig = ""; loadAll();
  });

  document.getElementById("send-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var input = document.getElementById("msg-input"), body = input.value.trim();
    if (!body || !partner) return;
    var r = await sb.from("messages").insert({ sender_id: user.id, receiver_id: partner, body: body });
    if (r.error) { setMsg("Could not send: " + r.error.message); return; }
    setMsg(""); input.value = "";
    lastSig = ""; loadAll();
  });

  await loadAll();
  if (!msgs.length && !partner) render(false);
  setInterval(loadAll, 5000);
})();
</script>
</body></html>
