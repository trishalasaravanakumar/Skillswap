<div><label class="font-label-md text-label-md text-on-surface-variant">Your name</label><input id="pf-name" maxlength="60" required class="w-full px-space-md py-space-sm bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"/></div>
<div><label class="font-label-md text-label-md text-on-surface-variant">Location (or "Remote")</label><input id="pf-location" maxlength="80" class="w-full px-space-md py-space-sm bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"/></div>
<div><label class="font-label-md text-label-md text-on-surface-variant">About you</label><textarea id="pf-bio" rows="3" maxlength="400" class="w-full px-space-md py-space-sm bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"></textarea></div>
<div class="flex gap-space-sm"><button type="submit" class="px-space-lg py-space-sm rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container shadow-sm">Save</button><button type="button" id="pf-cancel" class="px-space-lg py-space-sm rounded-lg bg-surface-container text-on-surface font-label-md text-label-md">Cancel</button></div>

<script src="app.js"></script>
<script>
(async function () {
  var S = window.SkillSwap, esc = S.esc;
  var user = await S.requireLogin();
  if (!user) return;
  var sb = S.sb;
  var profile = null, skills = [];
  var COLS = {
    teach: { title: "Skills I Can Teach", levels: ["Beginner friendly", "Intermediate", "Advanced", "Expert"], desc: "Description", ph: "e.g. Acoustic Guitar Basics", empty: "You haven't added anything to teach yet." },
    learn: { title: "Skills I Want to Learn", levels: ["Low priority", "Medium priority", "High priority"], desc: "Learning goal", ph: "e.g. Conversational Italian", empty: "You haven't added anything you want to learn yet." }
  };
  var INPUT = "w-full px-space-md py-space-sm bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary", BTN = "px-space-lg py-space-sm rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container shadow-sm";

  async function load() {
    var p = await sb.from("profiles").select("*").eq("id", user.id).single();
    profile = p.data || {};
    var s = await sb.from("skills").select("*").eq("user_id", user.id).order("created_at", { ascending: false });
    skills = s.data || [];
    renderProfile(); renderSkills();
  }

  function renderProfile() {
    document.getElementById("pv-name").textContent = profile.display_name || "Member";
    var meta = [user.email, profile.location].filter(Boolean).join("  \u00b7  ");
    document.getElementById("pv-meta").textContent = meta;
    document.getElementById("pv-bio").textContent = profile.bio || "Add a short bio so people know who you are.";
  }

  function renderSkills() {
    var html = "";
    ["teach", "learn"].forEach(function (kind) {
      var c = COLS[kind];
      var list = skills.filter(function (s) { return s.kind === kind; });
      html += '<div class="bg-surface-container-lowest rounded-xl shadow-sm p-space-lg space-y-space-md">' +
        '<div class="flex items-center justify-between"><h2 class="font-headline-md text-headline-md text-on-surface">' + c.title + '</h2>' +
        '<span class="font-label-md text-label-md text-primary bg-surface-container px-space-sm py-space-xs rounded-full">' + list.length + '</span></div>';
      if (!list.length) html += '<p class="font-body-md text-body-md text-on-surface-variant">' + c.empty + '</p>';
      list.forEach(function (s) {
        html += '<div class="bg-surface-container-low rounded-lg p-space-md flex items-start justify-between gap-space-sm">' +
          '<div><div class="font-title-md text-title-md text-on-surface">' + esc(s.title) + '</div>' +
          (s.level ? '<div class="font-label-md text-label-md text-primary">' + esc(s.level) + '</div>' : '') +
          (s.description ? '<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-xs">' + esc(s.description) + '</p>' : '') +
          '</div><button type="button" data-del="' + esc(s.id) + '" class="font-label-md text-label-md text-error hover:underline">Delete</button></div>';
      });
      html += '<form data-kind="' + kind + '" class="space-y-space-sm pt-space-sm">' +
        '<input name="title" required maxlength="100" placeholder="' + c.ph + '" class="' + INPUT + '"/>' +
        '<select name="level" class="' + INPUT + '">' + c.levels.map(function (l) { return "<option>" + l + "</option>"; }).join("") + '</select>' +
        '<textarea name="description" rows="2" maxlength="500" placeholder="' + c.desc + ' (optional)" class="' + INPUT + '"></textarea>' +
        '<button type="submit" class="' + BTN + '">+ Add skill</button></form></div>';
    });
    document.getElementById("skill-columns").innerHTML = html;
  }

  document.getElementById("skill-columns").addEventListener("submit", async function (e) {
    e.preventDefault();
    var f = e.target, kind = f.getAttribute("data-kind");
    var title = f.elements["title"].value.trim();
    if (!title) return;
    var r = await sb.from("skills").insert({ user_id: user.id, kind: kind, title: title, level: f.elements["level"].value, description: f.elements["description"].value.trim() });
    if (r.error) { document.getElementById("profile-msg").textContent = "Could not save: " + r.error.message; return; }
    document.getElementById("profile-msg").textContent = "";
    load();
  });

  document.getElementById("skill-columns").addEventListener("click", async function (e) {
    var id = e.target.getAttribute && e.target.getAttribute("data-del");
    if (!id) return;
    var r = await sb.from("skills").delete().eq("id", id).eq("user_id", user.id);
    if (r.error) { document.getElementById("profile-msg").textContent = "Could not delete: " + r.error.message; return; }
    load();
  });

  var view = document.getElementById("profile-view"), form = document.getElementById("profile-form");
  document.getElementById("edit-profile-btn").addEventListener("click", function () {
    document.getElementById("pf-name").value = profile.display_name || "";
    document.getElementById("pf-location").value = profile.location || "";
    document.getElementById("pf-bio").value = profile.bio || "";
    view.classList.add("hidden"); form.classList.remove("hidden");
  });
  document.getElementById("pf-cancel").addEventListener("click", function () {
    form.classList.add("hidden"); view.classList.remove("hidden");
  });
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var r = await sb.from("profiles").update({
      display_name: document.getElementById("pf-name").value.trim() || "Member",
      location: document.getElementById("pf-location").value.trim(),
      bio: document.getElementById("pf-bio").value.trim()
    }).eq("id", user.id);
    if (r.error) { document.getElementById("profile-msg").textContent = "Could not save: " + r.error.message; return; }
    document.getElementById("profile-msg").textContent = "";
    form.classList.add("hidden"); view.classList.remove("hidden");
    load();
  });

  load();
})();
</script>
