<header class="h-16 flex items-center px-margin-mobile lg:px-margin"><a href="index.html" class="flex items-center gap-space-sm font-headline-sm text-headline-sm text-on-surface"><img src="logo.svg" alt="" class="h-8 w-8"/>Skill Swap</a></header>
<main class="max-w-md mx-auto px-margin-mobile pt-space-xl pb-space-xl">
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-space-lg space-y-space-md">
<div class="flex gap-space-sm">
<button id="tab-login" type="button" class="flex-1 px-space-md py-space-sm rounded-lg bg-primary text-on-primary font-label-md text-label-md">Log in</button>
<button id="tab-signup" type="button" class="flex-1 px-space-md py-space-sm rounded-lg bg-surface-container text-on-surface-variant font-label-md text-label-md">Sign up</button>
</div>
<div id="setup-warning" class="hidden font-body-sm text-body-sm text-error">Supabase is not set up yet. Open supabase-config.js and paste your keys (see SETUP.md).</div>
<form id="auth-form" method="post" action="javascript:void(0)" class="space-y-space-md">
<div id="name-row" class="hidden"><label class="font-label-md text-label-md text-on-surface-variant">Your name</label><input id="a-name" name="name" autocomplete="name" maxlength="60" class="w-full px-space-md py-space-sm bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"/></div>
<div><label class="font-label-md text-label-md text-on-surface-variant">Email</label><input id="a-email" name="email" type="email" autocomplete="username" required class="w-full px-space-md py-space-sm bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"/></div>
<div><label class="font-label-md text-label-md text-on-surface-variant">Password (at least 6 characters)</label><input id="a-pass" name="password" type="password" autocomplete="current-password" minlength="6" required class="w-full px-space-md py-space-sm bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"/></div>
<button id="a-submit" type="submit" class="w-full px-space-lg py-space-sm rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container shadow-sm">Log in</button>
<p id="a-msg" class="font-body-sm text-body-sm text-on-surface-variant"></p>
</form>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var S = window.SkillSwap, mode = "login";
  var next = new URLSearchParams(location.search).get("next") || "profile.html";
  if (!/^[a-z]+\.html$/.test(next)) next = "profile.html";
  if (!S.configured) document.getElementById("setup-warning").classList.remove("hidden");
  var msg = document.getElementById("a-msg");
  function setMode(m) {
    mode = m;
    var on = ["bg-primary", "text-on-primary"], off = ["bg-surface-container", "text-on-surface-variant"];
    var tl = document.getElementById("tab-login"), ts = document.getElementById("tab-signup");
    (m === "login" ? tl : ts).classList.remove.apply((m === "login" ? tl : ts).classList, off);
    (m === "login" ? tl : ts).classList.add.apply((m === "login" ? tl : ts).classList, on);
    (m === "login" ? ts : tl).classList.remove.apply((m === "login" ? ts : tl).classList, on);
    (m === "login" ? ts : tl).classList.add.apply((m === "login" ? ts : tl).classList, off);
    document.getElementById("name-row").classList.toggle("hidden", m === "login");
    document.getElementById("a-submit").textContent = m === "login" ? "Log in" : "Create account";
    document.getElementById("a-pass").setAttribute("autocomplete", m === "login" ? "current-password" : "new-password");
    msg.textContent = "";
  }
  document.getElementById("tab-login").addEventListener("click", function () { setMode("login"); });
  document.getElementById("tab-signup").addEventListener("click", function () { setMode("signup"); });
  if (S.configured) S.getUser().then(function (u) { if (u) location.href = next; });
  document.getElementById("auth-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!S.configured) { msg.textContent = "Please finish the Supabase setup first."; return; }
    var email = document.getElementById("a-email").value.trim(), pass = document.getElementById("a-pass").value;
    msg.textContent = "Please wait...";
    if (mode === "signup") {
      var name = document.getElementById("a-name").value.trim() || email.split("@")[0];
      var r = await S.sb.auth.signUp({ email: email, password: pass, options: { data: { display_name: name } } });
      if (r.error) { msg.textContent = r.error.message; return; }
      if (r.data.session) { location.href = next; }
      else { setMode("login"); msg.textContent = "Account created! Check your email to confirm it, then log in."; }
    } else {
      var l = await S.sb.auth.signInWithPassword({ email: email, password: pass });
      if (l.error) { msg.textContent = l.error.message; return; }
      location.href = next;
    }
  });
})();
</script>
